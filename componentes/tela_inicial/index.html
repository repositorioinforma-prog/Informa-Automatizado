<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Início</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap"/>
<!--
  Tela inicial do Informa-Automatizado.
  Recebe args.secoes (definidas em analises/tela_inicial.py):
    [{id, titulo, sub, cor, icone, largura (1..12), layout ("vertical"|"horizontal"),
      cards:[{titulo, sub, icone, alvo}]}]
  Card com "alvo" abre a ferramenta (envia {alvo, nonce}); sem "alvo" = "Em breve".
-->
<style>
  :root{
    --txt:#0f172a; --muted:#64748b; --linha:#e8ecf3; --fundo:#f6f8fc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;color:var(--txt);
    font-family:"Source Sans Pro","Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  .grade{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;padding:4px 2px 8px}
  .secao{background:linear-gradient(180deg,#fbfcfe 0%,#f6f8fc 100%);border:1px solid var(--linha);border-radius:22px;
         padding:22px 24px 24px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.04);min-width:0}
  .topo{display:flex;align-items:center;gap:18px;margin-bottom:20px}
  .icone-secao{flex:none;width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;
               color:#fff;box-shadow:0 6px 16px var(--sombra)}
  .icone-secao svg{width:30px;height:30px}
  .topo h2{margin:0;font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.3px}
  .topo p{margin:4px 0 0;color:var(--muted);font-size:16px}
  .cards{display:grid;gap:16px}
  /* uma coluna por card (como no desenho); em telas estreitas, quebra em linhas */
  .cards{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
  @media (max-width: 1100px){
    .vertical .cards{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
    .horizontal .cards{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  }
  .card{position:relative;display:flex;text-align:left;font:inherit;color:inherit;cursor:pointer;
        background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:18px 20px;min-width:0;
        transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
  .vertical .card{flex-direction:column;gap:14px;min-height:180px;padding:18px 16px}
  .horizontal .card{flex-direction:row;align-items:center;gap:22px;min-height:104px}
  .card:hover{transform:translateY(-2px);border-color:var(--forte);box-shadow:0 10px 24px var(--sombra)}
  .card:focus-visible{outline:3px solid var(--forte);outline-offset:2px}
  .card:active{transform:translateY(0)}
  .icone-card{flex:none;width:clamp(56px,38cqi,72px);height:clamp(56px,38cqi,72px);border-radius:16px;background:var(--tile);color:var(--forte);
              display:flex;align-items:center;justify-content:center}
  .icone-card svg{width:38px;height:38px}
  .icone-card .aa{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
  /* o texto se ajusta à largura do card (cards estreitos = fonte um pouco menor) */
  .card{container-type:inline-size}
  .card h3{margin:0;font-size:clamp(14px,10.5cqi,19px);font-weight:800;line-height:1.2;hyphens:manual}
  .card p{margin:4px 0 0;color:var(--muted);font-size:clamp(12.5px,8.6cqi,15.5px);line-height:1.35}
  .horizontal .card h3{font-size:19px}
  .horizontal .card p{font-size:15.5px}
  .card > div:not(.icone-card){min-width:0}
  .horizontal .card.breve > div:not(.icone-card){padding-right:84px}
  .card .seta{position:absolute;top:16px;right:16px;color:var(--forte);opacity:0;transition:opacity .15s ease, transform .15s ease}
  .card:hover .seta{opacity:1;transform:translateX(2px)}
  .card.breve{cursor:default;opacity:.62}
  .card.breve:hover{transform:none;box-shadow:none;border-color:var(--borda)}
  .selo{position:absolute;top:12px;right:12px;font-size:11.5px;font-weight:800;letter-spacing:.2px;color:var(--muted);
        background:#fff;border:1px solid var(--linha);border-radius:999px;padding:2px 9px}
  .horizontal .selo{top:50%;transform:translateY(-50%);right:18px}
  .vertical .selo{position:static;align-self:flex-start;margin-top:auto}

  /* paletas por seção */
  .azul   {--forte:#2563eb;--grad:linear-gradient(135deg,#3b82f6,#2563eb);--tile:#e3ecff;--card:#f1f5ff;--borda:#dbe5fb;--sombra:rgba(37,99,235,.18)}
  .roxo   {--forte:#7c3aed;--grad:linear-gradient(135deg,#8b5cf6,#7c3aed);--tile:#ece4ff;--card:#f6f2ff;--borda:#e7defb;--sombra:rgba(124,58,237,.18)}
  .verde  {--forte:#0f9f7a;--grad:linear-gradient(135deg,#22c59a,#0f9f7a);--tile:#dcf5ec;--card:#f0faf6;--borda:#d5efe5;--sombra:rgba(15,159,122,.18)}
  .laranja{--forte:#f05a0a;--grad:linear-gradient(135deg,#fb923c,#f25c0b);--tile:#ffe6d5;--card:#fff4ec;--borda:#fde0cc;--sombra:rgba(242,92,11,.18)}
  .ciano  {--forte:#0e7490;--grad:linear-gradient(135deg,#22b8cf,#0e7490);--tile:#d9f3f8;--card:#effafc;--borda:#d2eef4;--sombra:rgba(14,116,144,.18)}
  .violeta{--forte:#6d4ee8;--grad:linear-gradient(135deg,#8b6cf6,#6d4ee8);--tile:#ebe5ff;--card:#f5f2ff;--borda:#e6dffb;--sombra:rgba(109,78,232,.18)}
  .icone-secao{background:var(--grad)}

  @media (max-width: 1100px){ .secao{grid-column:span 12 !important} }
</style>
</head>
<body>
<div class="grade" id="grade"></div>
<script>
(function(){
  "use strict";
  var ultimaAltura = 0;

  // ícones (traço, 24x24)
  var I = {
    calendario:'<path d="M7 3v3M17 3v3"/><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17"/><path d="M8 14h3M14 14h2M8 17h2"/>',
    documento:'<path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
    barras:'<path d="M6 20v-6M12 20V9M18 20V4"/>',
    engrenagem:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2.1 1.2M17.7 15.3l2.1 1.2M4.2 16.5l2.1-1.2M17.7 8.7l2.1-1.2"/><circle cx="12" cy="12" r="7"/>',
    banco:'<ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v6.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V5.5"/><path d="M4.5 12v6.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V12"/>',
    codigo:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4.5l-3 15"/>',
    tabela:'<rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M3.5 14.8h17M9.2 4v16M14.8 4v16"/>',
    pessoas:'<circle cx="9" cy="8" r="3.4"/><path d="M2.8 19.5c.6-3.3 3.1-5.3 6.2-5.3s5.6 2 6.2 5.3"/><circle cx="17" cy="9" r="2.6"/><path d="M16.6 14.3c2.5.2 4.2 1.9 4.7 4.6"/>',
    mapa:'<path d="M3.5 6.5l5.5-2.5 6 2.5 5.5-2.5v13.5l-5.5 2.5-6-2.5-5.5 2.5z"/><path d="M9 4v13.5M15 6.5V20"/>',
    dispersao:'<circle cx="5.5" cy="17.5" r="1.6"/><circle cx="10" cy="12" r="1.6"/><circle cx="14.5" cy="14.5" r="1.6"/><circle cx="19" cy="6.5" r="1.6"/><circle cx="7" cy="7" r="1.3"/><circle cx="17.5" cy="18" r="1.3"/><path d="M4 20L20 4" stroke-dasharray="2.2 2.4"/>',
    linha:'<path d="M3.5 3.5v17h17"/><path d="M6.5 16l4-5 3 3 6-7"/><circle cx="10.5" cy="11" r="1"/><circle cx="13.5" cy="14" r="1"/><circle cx="19.5" cy="7" r="1"/>',
    validacao:'<path d="M13.5 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h4"/><path d="M13.5 3v5h5V11"/><path d="M8.5 12.5h5M8.5 16h2.5"/><circle cx="17" cy="17" r="4"/><path d="M15.3 17l1.2 1.2 2.3-2.4"/>',
    codificacao:'<path d="M13.5 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h4"/><path d="M13.5 3v5h5V11"/><path d="M8.5 12.5h5M8.5 16h2.5"/><circle cx="17" cy="17" r="4"/><path d="M15.3 17l1.2 1.2 2.3-2.4"/>',
    balanca:'<path d="M12 3.5v16.5M7 20h10M5 6.5h14"/><path d="M5 6.5l-2.8 6.2a2.9 2.9 0 0 0 5.6 0z"/><path d="M19 6.5l-2.8 6.2a2.9 2.9 0 0 0 5.6 0z"/>',
    residuo:'<path d="M2 12h20"/><g fill="currentColor" stroke="none"><rect x="3.4" y="3" width="3.6" height="9" rx="1"/><rect x="8.4" y="12" width="3.6" height="6" rx="1"/><rect x="13.4" y="6.5" width="3.6" height="5.5" rx="1"/><rect x="18.4" y="12" width="3.6" height="8.5" rx="1"/></g>',
    lixeira:'<path d="M4 7h16M9.5 7V4.5h5V7"/><path d="M6.5 7l1 12.5a2 2 0 0 0 2 1.8h5a2 2 0 0 0 2-1.8l1-12.5"/><path d="M10 11v6M14 11v6"/>',
    etiqueta:'<path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.5 1.5 0 0 1 0 2.1l-6.2 6.2a1.5 1.5 0 0 1-2.1 0z"/><circle cx="8" cy="8" r="1.5"/>',
    dividir:'<rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M12 4v16" stroke-dasharray="2.2 2.2"/><path d="M6.5 9h3M6.5 13h3M14.5 9h3M14.5 13h3"/>',
    lupa:'<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/><path d="M8 10.5l1.8 1.8 3-3.2"/>',
    amostra:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
    reduzir:'<ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v6.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V5.5"/><path d="M9 18.5l3 3 3-3M12 15v6.5"/>',
    seta:'<path d="M9 6l6 6-6 6"/>'
  };
  function svg(nome){
    if(nome === "aa") return '<span class="aa">Aa</span>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
           (I[nome] || I.documento) + '</svg>';
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  // palavras longas só quebram na sílaba (com hífen) quando faltar espaço
  var SILABAS = {"Correspondência":"Correspon\u00ADdência", "Ponderação":"Ponde\u00ADração",
                 "Codificação":"Codifi\u00ADcação", "Programações":"Progra\u00ADmações",
                 "Padronização":"Padroni\u00ADzação", "Processador":"Proces\u00ADsador", "Validações":"Valida\u00ADções"};
  function hifen(t){ return t.replace(/[A-Za-zÀ-ÿ]+/g, function(w){ return SILABAS[w] || w; }); }

  function post(type, extra){
    var m = {isStreamlitMessage:true, type:type};
    for(var k in (extra||{})) m[k] = extra[k];
    window.parent.postMessage(m, "*");
  }
  function ajustarAltura(){
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 2;
    if(Math.abs(h - ultimaAltura) > 1){ ultimaAltura = h; post("streamlit:setFrameHeight", {height:h}); }
  }

  function render(secoes){
    var html = "";
    (secoes || []).forEach(function(sec){
      var cards = (sec.cards || []).map(function(c){
        var ativo = !!c.alvo;
        return '<button type="button" class="card' + (ativo ? '' : ' breve') + '"' +
          (ativo ? ' data-alvo="' + esc(c.alvo) + '" title="Abrir ' + esc(c.alvo) + '"' : ' aria-disabled="true" title="Em breve"') + '>' +
            '<div class="icone-card">' + svg(c.icone) + '</div>' +
            '<div><h3>' + hifen(esc(c.titulo)) + '</h3><p>' + esc(c.sub) + '</p></div>' +
            (ativo ? '<span class="seta">' + svg("seta") + '</span>' : '<span class="selo">Em breve</span>') +
          '</button>';
      }).join("");
      html += '<section class="secao ' + esc(sec.cor) + ' ' + esc(sec.layout || "vertical") + '"' +
              ' style="grid-column:span ' + (Number(sec.largura) || 12) + ';--n:' + (Number(sec.colunas) || Math.max(1, (sec.cards || []).length)) + '">' +
        '<div class="topo"><div class="icone-secao">' + svg(sec.icone) + '</div>' +
        '<div><h2>' + esc(sec.titulo) + '</h2><p>' + esc(sec.sub) + '</p></div></div>' +
        '<div class="cards">' + cards + '</div></section>';
    });
    document.getElementById("grade").innerHTML = html;
    ajustarAltura();
  }

  document.getElementById("grade").addEventListener("click", function(ev){
    var card = ev.target.closest("button.card[data-alvo]");
    if(!card) return;
    post("streamlit:setComponentValue", {
      value: {alvo: card.getAttribute("data-alvo"), nonce: Date.now() + "-" + Math.random().toString(36).slice(2)},
      dataType: "json"
    });
  });

  window.addEventListener("message", function(e){
    var d = e.data || {};
    if(d.type !== "streamlit:render") return;
    render((d.args || {}).secoes);
  });
  if(window.ResizeObserver) new ResizeObserver(ajustarAltura).observe(document.body);
  window.addEventListener("resize", ajustarAltura);
  post("streamlit:componentReady", {apiVersion:1});
})();
</script>
</body>
</html>
